<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        #map {
            height: 500px;
        }
    </style>
    <title>Leftlet 地圖 API 的使用</title>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        const divMap = document.querySelector("#map");
        // L 從上面的leaflet.js取得
        // .map() 把地圖的 div 元素傳入
        // .setView() 設定地圖的起始位置
        //     第一個參數, 座標陣列
        //     第二個參數, 縮放比
        const map = L.map(divMap).setView([24.9846952, 121.2219072], 13);
        // .tileLayer() 追定地圖圖資的拼圖
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        getGeolocation();


        function getGeolocation() {
            // 檢查支援度
            if (!navigator.geolocation) {
                output.innerHTML = "瀏覽器不支援";
                return;
            }
            // 請求定位

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // 成功
                    // 顯示在地圖上
                    const { latitude, longitude, accuracy } = position.coords; // 物件解包
                    // .marker() 水滴狀 icon, 需要傳入座標陣列
                    // 最後一定要記得 .addTo() 加到地圖物件中
                    const marker = L.marker([latitude, longitude])
                        .addTo(map)
                        .bindPopup(`經度${latitude}, 緯度${longitude}`)
                        .openPopup();
                    // .bindPopup() 負責寫入資料到地圖上
                    // .openPopup() 加上這句才是打開對話框
                },
                (error) => {
                    // 失敗
                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            output.innerHTML = "取得座標...拒絕提供權限";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            output.innerHTML = "取得座標...無法取得位置資訊";
                            break;
                        case error.TIMEOUT:
                            output.innerHTML = "取得座標...取得位置資訊逾時";
                            break;
                        default:
                            output.innerHTML = "取得座標...失敗";
                    }
                }
            );
        }
    </script>
</body>

</html>
